name: Collect and compute East Asia forecast

on:
  # Primary schedule: the Muse cron job `weather-collection-dispatch`
  # dispatches this workflow daily at 05:00 JST with an explicit
  # target_date_jst (GitHub's own scheduler fired the 2026-11-09 run
  # 3h25m late and dropped the 2026-11-10 slot entirely).
  # Backup: the GitHub schedule below fires 5 minutes after the primary
  # (05:05 JST nominal). dispatch_guard binds a delayed schedule run
  # to its report date and checks the published data branch.
  schedule:
    - cron: '5 20 * * *' # 05:05 JST backup; guarded, see dispatch_guard
  workflow_dispatch:
    inputs:
      target_date_jst:
        description: 'Optional report date YYYY-MM-DD; default is the next 06:00 JST report'
        required: false
        type: string
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'requirements-*.txt', '.github/workflows/collect.yml']
  # Pull requests run only the fixture suite; main pushes run a live
  # collection smoke test. Only a scheduled or deliberate manual dispatch
  # may replace the published snapshot.
  pull_request:
    paths: ['scripts/**', 'tests/**', 'requirements-*.txt', '.github/workflows/collect.yml']

permissions:
  contents: read

concurrency:
  # A code-push smoke test must not displace a pending daily collection.
  group: ${{ github.event_name == 'pull_request' && format('east-asia-weather-pr-tests-{0}', github.ref) || github.event_name == 'push' && 'east-asia-weather-push-smoke' || 'east-asia-weather-collection' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dispatch_guard:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
      target_date_jst: ${{ steps.guard.outputs.target_date_jst }}
    steps:
      - name: Check out backup guard
        if: github.event_name == 'schedule'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check publication for the scheduled report date
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          created_at="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          python3 scripts/backup_guard.py --schedule "$SCHEDULE" --created-at "$created_at"
  pr_tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install calculation dependencies used by the tests
        run: python3 -m pip install -r requirements-collection.txt -r requirements-compute.txt -r requirements-chart.txt
      - name: Set up R for the chart renderer smoke test
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true
      - name: Install R chart packages
        run: |
          Rscript -e 'install.packages(c("ggplot2", "jsonlite", "ragg", "svglite", "png"), repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/latest"))' \
          || Rscript -e 'install.packages(c("ggplot2", "jsonlite", "ragg", "svglite", "png"), repos = "https://cloud.r-project.org")'
      - name: Install Japanese and weather-symbol fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-core fonts-noto-color-emoji
      - name: Run the full test suite
        run: python3 -m unittest discover -s tests -v
  collect:
    needs: dispatch_guard
    if: github.event_name != 'pull_request' && needs.dispatch_guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Check out collector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      - name: Install forecast decoders and calculation/chart dependencies
        run: python3 -m pip install -r requirements-collection.txt -r requirements-compute.txt -r requirements-chart.txt
      - name: Set up R for the chart renderer
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true
      - name: Install R chart packages
        run: |
          Rscript -e 'install.packages(c("ggplot2", "jsonlite", "ragg", "svglite", "png"), repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/latest"))' \
          || Rscript -e 'install.packages(c("ggplot2", "jsonlite", "ragg", "svglite", "png"), repos = "https://cloud.r-project.org")'
      - name: Install Japanese and weather-symbol fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-core fonts-noto-color-emoji
      - name: Test coverage and failure handling
        run: python3 -m unittest discover -s tests -v
      - name: Collect live numerical data
        id: collect
        continue-on-error: true
        env:
          TARGET_DATE_JST: ${{ needs.dispatch_guard.outputs.target_date_jst || inputs.target_date_jst }}
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ -z "$TARGET_DATE_JST" ]; then
            echo "::error::Scheduled backup has no bound report date."
            exit 1
          fi
          args=()
          if [ -n "$TARGET_DATE_JST" ]; then
            args+=(--target-date-jst "$TARGET_DATE_JST")
          fi
          python3 -u scripts/collect.py "${args[@]}" --out-dir output
      - name: Calculate weather values and render the chart
        id: prepare
        if: always() && steps.collect.outcome != 'skipped'
        continue-on-error: true
        run: python3 scripts/prepare_report.py --output output
      - name: Retain full raw responses and diagnostics
        if: always() && steps.collect.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weather-raw-${{ github.run_id }}
          path: output/
          retention-days: 14
          if-no-files-found: error
      - name: Publish data and exact completeness status
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.collect.outcome != 'skipped'
        run: python3 scripts/publish_data.py --output output
      - name: Write collection summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          file = Path('output/latest/manifest.json')
          text = 'Collection failed before a manifest was written.'
          if file.exists():
              m = json.loads(file.read_text())
              text = f'Report date: {m["target_date_jst"]}\n\n```json\n{json.dumps({"data_quality": m["quality"], "products": m.get("products", {})}, indent=2)}\n```'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(text + '\n')
          PY
      - name: Fail if required inputs or computed products are missing
        if: steps.collect.outcome == 'failure' || steps.prepare.outcome == 'failure'
        run: exit 1
