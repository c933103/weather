name: Collect and compute East Asia forecast

on:
  # Primary schedule: the Muse cron job `weather-collection-dispatch`
  # dispatches this workflow daily at 05:00 JST with an explicit
  # target_date_jst (GitHub's own scheduler fired the 2026-11-09 run
  # 3h25m late and dropped the 2026-11-10 slot entirely).
  # Backup: the GitHub schedule below fires 5 minutes after the primary
  # (05:05 JST nominal; GitHub may start it later than that). The
  # dispatch_guard job turns it into a no-op whenever another run of
  # this workflow already started in this data cycle — at or after the
  # 12:00 UTC (21:00 JST) model release the cycle is built on — so the
  # backup collects only when the primary dispatch did not trigger,
  # and a pre-release run on the previous cycle never suppresses it.
  schedule:
    - cron: '5 20 * * *' # 05:05 JST backup; guarded, see dispatch_guard
  workflow_dispatch:
    inputs:
      target_date_jst:
        description: 'Optional report date YYYY-MM-DD; default is the next 06:00 JST report'
        required: false
        type: string
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'requirements-*.txt', '.github/workflows/collect.yml']

permissions:
  contents: write
  actions: read

concurrency:
  group: east-asia-weather-collection
  cancel-in-progress: false

jobs:
  dispatch_guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
    steps:
      - name: Backup schedule yields when the primary dispatch already started a run
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Not a schedule run; proceeding."
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timedelta, timezone
          def decide():
              token = os.environ['GH_TOKEN']
              repo = os.environ['GITHUB_REPOSITORY']
              run_id = int(os.environ['RUN_ID'])
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/workflows/collect.yml/runs?per_page=15',
                  headers={'Authorization': f'Bearer {token}',
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=60) as resp:
                  runs = json.load(resp)['workflow_runs']
              # Cycle boundary: this report cycle is built on the 12:00 UTC
              # (21:00 JST) model release. Only runs created at or after
              # that release count as this cycle's collection; a run from
              # before it used the previous cycle's data and must not
              # suppress the backup. The anchor (start - 8h) keeps the
              # boundary on the scheduled day even when GitHub starts
              # this run hours late.
              anchor = datetime.now(timezone.utc) - timedelta(hours=8)
              cutoff = anchor.replace(hour=12, minute=0, second=0, microsecond=0)
              if cutoff > anchor:
                  cutoff -= timedelta(days=1)
              others = [r for r in runs
                        if r['id'] != run_id
                        and datetime.strptime(r['created_at'], '%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=timezone.utc) >= cutoff]
              print(f'Cycle cutoff {cutoff.isoformat()}; other runs at/after it: {[r["id"] for r in others]}')
              return 'false' if others else 'true'
          try:
              proceed = decide()
          except Exception as exc:
              # Fail open: a duplicate collection is harmless, a missed one is not.
              print(f'Guard check failed ({exc!r}); proceeding.')
              proceed = 'true'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'proceed={proceed}\n')
          print(f'proceed={proceed}')
          PY
  collect:
    needs: dispatch_guard
    if: needs.dispatch_guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out collector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install forecast decoders and calculation/chart dependencies
        run: python3 -m pip install -r requirements-collection.txt -r requirements-compute.txt -r requirements-chart.txt
      - name: Set up R for the chart renderer
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true
      - name: Install R chart packages
        run: |
          Rscript -e 'install.packages(c("ggplot2", "jsonlite", "ragg", "svglite", "png"), repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/latest"))' \
          || Rscript -e 'install.packages(c("ggplot2", "jsonlite", "ragg", "svglite", "png"), repos = "https://cloud.r-project.org")'
      - name: Install Japanese and weather-symbol fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-core fonts-noto-color-emoji
      - name: Test coverage and failure handling
        run: python3 -m unittest discover -s tests -v
      - name: Collect live numerical data
        id: collect
        continue-on-error: true
        env:
          TARGET_DATE_JST: ${{ inputs.target_date_jst }}
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          args=()
          if [ -n "$TARGET_DATE_JST" ]; then
            args+=(--target-date-jst "$TARGET_DATE_JST")
          fi
          python3 -u scripts/collect.py "${args[@]}" --out-dir output
      - name: Calculate weather values and render the chart
        id: prepare
        if: always() && steps.collect.outcome != 'skipped'
        continue-on-error: true
        run: python3 scripts/prepare_report.py --output output
      - name: Retain full raw responses and diagnostics
        if: always() && steps.collect.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weather-raw-${{ github.run_id }}
          path: output/
          retention-days: 14
          if-no-files-found: error
      - name: Publish data and exact completeness status
        if: always() && steps.collect.outcome != 'skipped'
        run: python3 scripts/publish_data.py --output output
      - name: Write collection summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          file = Path('output/latest/manifest.json')
          text = 'Collection failed before a manifest was written.'
          if file.exists():
              m = json.loads(file.read_text())
              text = f'Report date: {m["target_date_jst"]}\n\n```json\n{json.dumps({"data_quality": m["quality"], "products": m.get("products", {})}, indent=2)}\n```'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(text + '\n')
          PY
      - name: Fail if required inputs or computed products are missing
        if: steps.collect.outcome == 'failure' || steps.prepare.outcome == 'failure'
        run: exit 1
