name: Collect WNP watch source evidence

on:
  schedule:
    # Before existing 00:45 and 12:45 Asia/Taipei watch checkpoints.
    - cron: '10 4,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wnp-source-handoff
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install existing ECMWF BUFR decoder
        run: python3 -m pip install -r requirements-collection.txt
      - name: Collect independently timestamped source inventory
        run: python3 scripts/wnp_watch_collect.py --out output/wnp-watch/evidence.json
      - name: Archive evidence even if incomplete
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wnp-watch-sources-${{ github.run_id }}
          path: output/wnp-watch/
          retention-days: 14
          if-no-files-found: warn
      - name: Publish a distinct watch-source snapshot on data branch
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin data
          git worktree add --detach /tmp/wnp-publish origin/data
          mkdir -p /tmp/wnp-publish/wnp-watch
          python3 scripts/wnp_watch_handoff.py --github-actions \
            --source output/wnp-watch/evidence.json --output /tmp/wnp-publish/wnp-watch
          cd /tmp/wnp-publish
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wnp-watch/latest.json wnp-watch/latest.json.gz
          git commit -m "Refresh WNP source handoff: ${GITHUB_EVENT_NAME} run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT} [skip ci]"
          git push origin HEAD:refs/heads/data
